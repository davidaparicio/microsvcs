version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /projects/blue/docker
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /projects/blue
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /projects/git-sync/docker
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /projects/git-sync
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /projects/green/docker
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /projects/green
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /projects/red/docker
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /projects/red
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /projects/yellow/docker
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: /projects/yellow
    schedule:
      interval: daily
