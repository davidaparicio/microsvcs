apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: git-sync-development
resources:
- ../../../base/git-sync
namePrefix: git-sync-
commonLabels:
  app.kubernetes.io/name: git-sync
  app.kubernetes.io/instance: git-sync-development
  environment: development
images:
- name: quay.io/davidaparicio/app
  newName: quay.io/davidaparicio/git-sync
  newTag: sha-ead009d
replicas:
- name: app
  count: 1
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: app
    spec:
      template:
        spec:
          containers:
          - name: app
            env:
            - name: SYNC_INTERVAL
              value: "*/2 * * * *"
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: "git-sync.dev.127.0.0.1.nip.io"
  target:
    kind: Ingress
